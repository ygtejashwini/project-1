
name: First CI Pipeline

on:
  pull_request:
    types: [opened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run shell script
        run: bash hello.sh
      - name: Build message
        run: echo "Build job completed successfully"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test message
        run: echo "Test job completed successfully"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy message
        run: echo "Deploy job completed successfully"
